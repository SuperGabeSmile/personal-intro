<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Welcome to my personal space. A simple introduction, and a little hello.">
    <meta name="theme-color" content="#f6f5f1">
    <title>My Personal Space · Hello</title>
    <style>
      :root { color-scheme: light; --paper: #f6f5f1; --ink: #262b27; --muted: #5d665f; --green: #356445; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; }
      .page { max-width: 1200px; min-height: 100svh; margin: auto; padding: 36px 60px 24px; display: flex; flex-direction: column; }
      header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
      .mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: white; font-size: 17px; }
      .note { color: var(--muted); letter-spacing: .12em; font-size: 11px; }
      main { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; align-items: center; gap: 48px; padding: 80px 0; }
      .eyebrow { color: var(--green); font-size: 12px; font-weight: 600; letter-spacing: .18em; margin: 0 0 26px; }
      h1 { font-size: clamp(42px, 5vw, 66px); font-weight: 500; line-height: 1.3; letter-spacing: -.04em; margin: 0 0 30px; }
      h1 span { display: block; }
      .intro { color: var(--muted); font-size: 16px; line-height: 1.9; margin: 0; max-width: 380px; }
      .hello { display: inline-block; margin-top: 38px; padding: 10px 16px; border: 1px solid #cfd7cd; border-radius: 100px; color: var(--green); font-size: 12px; }
      .art { width: 100%; max-width: 400px; justify-self: end; aspect-ratio: 1; border-radius: 50% 50% 10px 10px; background: #e6ebdf; position: relative; overflow: hidden; }
      .sun { position: absolute; width: 106px; height: 106px; top: 64px; right: 54px; border-radius: 50%; background: #f4e3b1; }
      .hill { position: absolute; width: 140%; height: 85%; border-radius: 50% 50% 0 0; }
      .hill.back { background: #a8b99b; left: -50%; bottom: -20%; transform: rotate(25deg); }
      .hill.front { background: #456c50; right: -50%; bottom: -33%; transform: rotate(-28deg); }
      .art-label { position: absolute; left: 24px; bottom: 23px; color: #fff; font-family: Georgia, serif; font-style: italic; font-size: 23px; }
      footer { border-top: 1px solid #dce0d7; padding-top: 20px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 18px; line-height: 1.6; }
      @media (max-width: 760px) {
        .page { padding: 25px 26px 22px; }
        main { grid-template-columns: 1fr; gap: 46px; padding: 64px 0 48px; }
        h1 { font-size: clamp(35px, 9vw, 52px); }
        .art { max-width: 330px; justify-self: center; }
        .note { font-size: 10px; letter-spacing: .04em; }
        footer { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand"><span class="mark" aria-hidden="true">✳</span>My personal space</div>
        <span class="note" lang="en">A LITTLE ABOUT ME</span>
      </header>
      <main>
        <section aria-labelledby="welcome">
          <p class="eyebrow" lang="en">HELLO, WORLD</p>
          <h1 id="welcome"><span>Hello there.</span><span>Glad you're here.</span></h1>
          <p class="intro">Welcome to my little corner of the internet.<br>A simple space to say hello. Thanks for stopping by.</p>
          <span class="hello">A simple beginning</span>
        </section>
        <div class="art" aria-hidden="true">
          <div class="sun"></div><div class="hill back"></div><div class="hill front"></div>
          <span class="art-label">Nice to meet you.</span>
        </div>
      </main>
      <footer><span>My personal space</span><span lang="en">Keep it simple.</span></footer>
    </div>
  </body>
</html>
